name: Atualizar dados da PAM (IBGE)

on:
  schedule:
    - cron: "41 10 * * 1" # toda segunda às 07:41 (Brasília) — a PAM é anual, mas pode ser revista
  workflow_dispatch:
    inputs:
      inicio:
        description: "Ano inicial (o SICOR começa em 2013)"
        default: "2013"

permissions:
  contents: write

concurrency:
  group: dados-pam
  cancel-in-progress: false

jobs:
  pam:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar PAM (SIDRA 5457)
        run: python etl/pam_etl.py --inicio "${{ github.event.inputs.inicio || '2013' }}" --out public/data

      - name: Publicar dados novos
        run: |
          if git diff --quiet -- public/data ':!public/data/pam_meta.json' && [ -z "$(git ls-files --others --exclude-standard public/data)" ]; then
            echo "Sem dados novos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "dados: atualização PAM $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
